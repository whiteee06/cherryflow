name: Database Migration Check

on:
  push:
    paths:
      - 'supabase/migrations/**'
  pull_request:
    paths:
      - 'supabase/migrations/**'

jobs:
  validate-migrations:
    name: Validate Supabase SQL Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Migration Files Syntax
        run: |
          for file in supabase/migrations/*.sql; do
            echo "Checking syntax of $file..."
            if [ ! -s "$file" ]; then
              echo "Error: Migration file $file is empty!"
              exit 1
            fi
          done
          echo "All migration files syntax verified."
